<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced LaTeX Editor & Exporter</title>

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-dark: #1E1E2E;
            --bg-panel: #2A2A3C;
            --text-light: #E2E8F0;
            --border: #3F3F5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar Styles */
        .toolbar {
            background-color: var(--bg-panel);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .toolbar h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Split Screen Editor/Preview */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            width: 50%;
        }

        .panel-header {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #94A3B8;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Input Area */
        textarea {
            flex: 1;
            background-color: #181825;
            color: #A6E3A1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        /* Preview Area */
        .preview-container {
            flex: 1;
            background-color: white;
            color: black;
            border-radius: 8px;
            padding: 40px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>LaTeX to PDF/Word Converter</h1>
        <div class="btn-group">
            <button onclick="exportPDF()">📄 Export PDF</button>
            <button onclick="exportWord()">📝 Export Word</button>
        </div>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">LaTeX Input (Use $$ for math)</div>
            <textarea id="latex-input" placeholder="Type your text here. 

Use $$ for block equations: 
$$ x = \frac{-b \pm \sqrt{b^2-4ac}}{2a} $$

Use \( \) for inline math: \( E = mc^2 \)..."></textarea>
        </div>

        <div class="panel">
            <div class="panel-header">Live Preview</div>
            <div class="preview-container" id="preview-output">
                </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('latex-input');
        const previewArea = document.getElementById('preview-output');

        // 1. Live Preview & LaTeX Rendering
        // We use a slight delay (debounce) so MathJax doesn't overload on every single keystroke
        let timeout = null;
        inputArea.addEventListener('input', () => {
            clearTimeout(timeout);
            
            // Format line breaks for HTML before pushing to preview
            let rawText = inputArea.value.replace(/\n/g, '<br>');
            previewArea.innerHTML = rawText;

            timeout = setTimeout(() => {
                // Tell MathJax to re-scan the preview area and render equations
                MathJax.typesetPromise([previewArea]).catch((err) => console.log(err.message));
            }, 500); 
        });

        // 2. Export to PDF Function
        function exportPDF() {
            const element = document.getElementById('preview-output');
            // Configuration for the PDF
            const opt = {
                margin:       1,
                filename:     'Converted_Document.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 }, // Higher scale means better resolution
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            // Generate and save
            html2pdf().set(opt).from(element).save();
        }

        // 3. Export to Word (Document) Function
        function exportWord() {
            // We wrap the HTML in specific XML namespaces that MS Word understands
            const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
            const postHtml = "</body></html>";
            const html = preHtml + document.getElementById('preview-output').innerHTML + postHtml;

            const blob = new Blob(['\ufeff', html], {
                type: 'application/msword'
            });
            
            // Create a hidden download link and click it programmatically
            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = 'Converted_Document.doc';
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
